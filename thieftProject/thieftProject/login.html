
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nationwide Software-Based Theft Reporting and Tracking System</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <link rel="stylesheet" href="assets/css/login.css">


</head>


<body>


<div class="container">


    <div class="login-box">


        <div class="left">


            <h2>Welcome Back</h2>


            <p>

                Access the Nationwide Software-Based Theft Reporting and
                Tracking System securely to report theft incidents,
                track investigations and manage your account.

            </p>


        </div>


        <div class="right">


            <h2>Login</h2>


            <p class="subtitle">

                Sign in to continue

            </p>





            <form id="loginForm">




                <div class="input-group">


                    <label>Email Address</label>


                    <input

                        type="email"

                        id="email"

                        placeholder="Enter Email Address"

                    >


                    <small class="error" id="emailError">

                        Please enter a valid email.

                    </small>


                </div>











                <div class="input-group">


                    <label>Password</label>


                    <div class="password-box">


                        <input

                            type="password"

                            id="password"

                            placeholder="Enter Password"

                        >


                    </div>



                    <small class="error" id="passwordError">

                        Password is required.

                    </small>


                </div>


















                <!-- Remember -->


                <div class="options">


                    <label>


                        <input type="checkbox">


                        Remember Me


                    </label>



                    <a href="#">


                        Forgot Password?


                    </a>



                </div>








                <!-- Button -->


                <button type="submit">


                    Login


                </button>





            </form>








            <div class="register-link">


                Don't have an account?


                <a href="register.html">


                    Register


                </a>



            </div>




        </div>



    </div>



</div>







<script src="assets/js/login.js"></script>


</body>


</html>
