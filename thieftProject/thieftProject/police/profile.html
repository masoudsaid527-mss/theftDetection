<!-- ================= MAIN ================= -->


<div class="main">



<div class="header">


<h2>

Police Profile

</h2>


<p>

Manage officer information.

</p>


</div>









<!-- PROFILE CARD -->


<div class="section profile-card">


<div class="profile-image">


<img src="../assets/images/user.png"
alt="Officer Image">


<button>

<i class="fa-solid fa-camera"></i>

</button>


</div>




<h2>

Officer John

</h2>


<p>

Police Officer

</p>



</div>









<!-- PERSONAL INFORMATION -->


<div class="section">


<h2>

Personal Information

</h2>



<form>



<div class="input-row">



<div class="input-group">


<label>

Full Name

</label>


<input

type="text"

value="Officer John"

>


</div>







<div class="input-group">


<label>

Email Address

</label>


<input

type="email"

value="officer@nsttrs.com"

>


</div>




</div>








<div class="input-row">



<div class="input-group">


<label>

Phone Number

</label>


<input

type="text"

value="+255700000000"

>


</div>







<div class="input-group">


<label>

Officer ID

</label>


<input

type="text"

value="POL001"

readonly

>


</div>




</div>









<div class="input-row">



<div class="input-group">


<label>

Rank

</label>


<input

type="text"

value="Inspector"

>


</div>







<div class="input-group">


<label>

Police Station

</label>


<input

type="text"

value="Zanzibar Central Police Station"

>


</div>




</div>








<button type="submit">


<i class="fa-solid fa-save"></i>

Save Changes


</button>




</form>



</div>









<!-- CHANGE PASSWORD -->


<div class="section">


<h2>

Change Password

</h2>



<form>



<div class="input-group">


<label>

Current Password

</label>


<input type="password">


</div>






<div class="input-group">


<label>

New Password

</label>


<input type="password">


</div>






<div class="input-group">


<label>

Confirm Password

</label>


<input type="password">


</div>







<button>


<i class="fa-solid fa-key"></i>

Update Password


</button>



</form>


</div>

</div>
