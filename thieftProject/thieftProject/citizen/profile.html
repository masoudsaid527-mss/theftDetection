<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | NSTRTS</title>


    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS -->
   <link rel="stylesheet" href="../assets/css/profile.css">


</head>


<body>



<!-- ================= SIDEBAR ================= -->


<div class="sidebar">


    <div class="logo">

        <img src="../assets/images/logo.png" alt="Logo">

        <h2>NSTRTS</h2>

    </div>



    <ul>


        <li>

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

        </li>



        <li>

            <a href="report-theft.html">

                <i class="fa-solid fa-file-circle-plus"></i>

                Report Theft

            </a>

        </li>



        <li>

            <a href="my-reports.html">

                <i class="fa-solid fa-folder-open"></i>

                My Reports

            </a>

        </li>



        <li class="active">

            <a href="profile.html">

                <i class="fa-solid fa-user"></i>

                Profile

            </a>

        </li>



        <li>

            <a href="../login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </li>


    </ul>


</div>







<!-- ================= MAIN ================= -->


<div class="main">



    <div class="header">


        <h2>

            My Profile

        </h2>


        <p>

            Manage your personal information.

        </p>


    </div>








    <!-- PROFILE CARD -->


    <div class="section profile-card">



        <div class="profile-image">


            <img src="../assets/images/user.png"
            alt="User Image">



            <button>

                <i class="fa-solid fa-camera"></i>

            </button>



        </div>





        <h2>

            John Citizen

        </h2>



        <p>

            Citizen Account

        </p>



    </div>









    <!-- PERSONAL INFORMATION -->


    <div class="section">


        <h2>

            Personal Information

        </h2>





        <form id="profileForm">





            <div class="input-row">


                <div class="input-group">


                    <label>

                        Full Name

                    </label>


                    <input

                    type="text"

                    value="John Citizen">


                </div>





                <div class="input-group">


                    <label>

                        Email Address

                    </label>


                    <input

                    type="email"

                    value="john@email.com">


                </div>



            </div>







            <div class="input-row">


                <div class="input-group">


                    <label>

                        Phone Number

                    </label>


                    <input

                    type="text"

                    value="+255700000000">


                </div>






                <div class="input-group">


                    <label>

                        National ID

                    </label>


                    <input

                    type="text"

                    value="123456789">


                </div>



            </div>







            <div class="input-group">


                <label>

                    Address

                </label>


                <textarea rows="4">

Zanzibar, Tanzania

                </textarea>


            </div>







            <button type="submit">

                <i class="fa-solid fa-save"></i>

                Save Changes

            </button>



        </form>



    </div>

    <!-- CHANGE PASSWORD -->


    <div class="section">


        <h2>

            Change Password

        </h2>





        <form>



            <div class="input-group">


                <label>

                    Current Password

                </label>


                <input type="password">


            </div>





            <div class="input-group">


                <label>

                    New Password

                </label>


                <input type="password">


            </div>





            <div class="input-group">


                <label>

                    Confirm New Password

                </label>


                <input type="password">


            </div>





            <button>

                Update Password

            </button>



        </form>



    </div>






</div>

</body>

</html>
